name: Playwright

on:
  push:
    branches: [main, Shivanand_Playwright_POM]
  pull_request:
    branches: [main,Shivanand_Playwright_POM]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: strivacity-playwright

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: strivacity-playwright/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Install Playwright Chromium
        if: github.event_name != 'pull_request'
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        if: github.event_name != 'pull_request'
        run: npm test
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          STRIVACITY_TENANT: ${{ secrets.STRIVACITY_TENANT }}
          STRIVACITY_IDENTITY_STORE: ${{ secrets.STRIVACITY_IDENTITY_STORE }}
          STRIVACITY_CLIENT_ID: ${{ secrets.STRIVACITY_CLIENT_ID }}
          STRIVACITY_CLIENT_SECRET: ${{ secrets.STRIVACITY_CLIENT_SECRET }}
          MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
          MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}

      - name: Upload Playwright report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: strivacity-playwright/playwright-report/
          if-no-files-found: ignore
          retention-days: 30
